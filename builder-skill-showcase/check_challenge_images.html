
<!DOCTYPE html>
<html>
<head>
    <title>Challenge Images Checker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .challenge { border: 1px solid #ccc; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .image-test { margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        img { max-width: 200px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Challenge Images Database Checker</h1>
    <button onclick="checkChallenges()">Check Challenge Images</button>
    <div id="results"></div>
    
    <script>
        const SUPABASE_URL = "https://udjwjoymlofdocclufxv.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkandqb3ltbG9mZG9jY2x1Znh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU5NDkwMzYsImV4cCI6MjA2MTUyNTAzNn0.mN9DM5QJGysbPOplOBSS7WH1qhPk4Y67JMd2gafzEog";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        async function checkChallenges() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Checking challenges...</p>';
            
            try {
                const { data: challenges, error } = await supabase
                    .from('challenges')
                    .select('id, title, image_url, image_urls');
                
                if (error) throw error;
                
                results.innerHTML = `<h2>Found ${challenges.length} challenges</h2>`;
                
                for (const challenge of challenges) {
                    const challengeDiv = document.createElement('div');
                    challengeDiv.className = 'challenge';
                    challengeDiv.innerHTML = `
                        <h3>${challenge.title}</h3>
                        <p><strong>ID:</strong> ${challenge.id}</p>
                        <div class="image-test">
                            <strong>Primary Image URL:</strong> 
                            <span class="${challenge.image_url ? 'success' : 'warning'}">
                                ${challenge.image_url || 'No primary image'}
                            </span>
                        </div>
                        <div class="image-test">
                            <strong>Additional Images:</strong> 
                            <span class="${challenge.image_urls && challenge.image_urls.length > 0 ? 'success' : 'warning'}">
                                ${challenge.image_urls ? `${challenge.image_urls.length} images` : 'No additional images'}
                            </span>
                        </div>
                    `;
                    
                    // Test primary image if it exists
                    if (challenge.image_url) {
                        const imageTest = await testImageUrl(challenge.image_url);
                        const imageDiv = document.createElement('div');
                        imageDiv.innerHTML = `
                            <strong>Primary Image Test:</strong> 
                            <span class="${imageTest.success ? 'success' : 'error'}">
                                ${imageTest.message}
                            </span>
                        `;
                        challengeDiv.appendChild(imageDiv);
                        
                        if (imageTest.success) {
                            const img = document.createElement('img');
                            img.src = challenge.image_url;
                            img.alt = 'Primary challenge image';
                            challengeDiv.appendChild(img);
                        }
                    }
                    
                    // Test additional images if they exist
                    if (challenge.image_urls && Array.isArray(challenge.image_urls)) {
                        for (let i = 0; i < challenge.image_urls.length; i++) {
                            const url = challenge.image_urls[i];
                            const imageTest = await testImageUrl(url);
                            const imageDiv = document.createElement('div');
                            imageDiv.innerHTML = `
                                <strong>Additional Image ${i + 1} Test:</strong> 
                                <span class="${imageTest.success ? 'success' : 'error'}">
                                    ${imageTest.message}
                                </span>
                            `;
                            challengeDiv.appendChild(imageDiv);
                            
                            if (imageTest.success) {
                                const img = document.createElement('img');
                                img.src = url;
                                img.alt = `Additional challenge image ${i + 1}`;
                                challengeDiv.appendChild(img);
                            }
                        }
                    }
                    
                    results.appendChild(challengeDiv);
                }
                
            } catch (error) {
                results.innerHTML = `<p class="error">Error: ${error.message}</p>`;
                console.error('Error checking challenges:', error);
            }
        }
        
        async function testImageUrl(url) {
            try {
                const response = await fetch(url);
                return {
                    success: response.ok,
                    message: `Status: ${response.status} - ${response.ok ? 'Image accessible' : 'Image not accessible'}`
                };
            } catch (error) {
                return {
                    success: false,
                    message: `Network error: ${error.message}`
                };
            }
        }
    </script>
</body>
</html>
